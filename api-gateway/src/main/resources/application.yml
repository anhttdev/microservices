server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**

        - id: user-service-auth-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: product-service-route
          uri: http://product-service:8082
          predicates:
            - Path=/api/v1/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway