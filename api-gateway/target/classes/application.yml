server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://localhost:8081 # Will later transition to K8s DNS or load balancing
          predicates:
            - Path=/api/v1/users/**
            
        - id: user-service-auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway